name: verify-sources

# 逐站真实链路校验（搜索 → 分类 → 详情 → 章节 → 音频直链 → 真拉 1KB）
# 境外 runner 上部分站点可能网络不可达，那不算源坏了；以本机复跑为准。
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"   # 每天 04:00（北京时间）跑一次，好知道哪个源失效了

jobs:
  subscription:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验订阅文件（阻塞）
        run: python3 tools/verify_subscription.py subscription/sources.json

  # 按 iOS App 的 Codable schema 再验一遍（阻塞）。
  # 为什么单列一项：Python 复刻引擎的宽松度和 Swift 的 JSONDecoder 不同 ——
  # 曾发生「10 个源 Python 全绿，但 App 里整份订阅导入失败」（ListRule.list 被声明成必填，
  # 3 个 JSON 模式的源没写它，整体 decode 一抛错，一个源都进不去）。
  # schema 从 App 仓库的 Sources/RuleSource.swift 现场解析，不手抄、不会漂移。
  ios_schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                     # 书源仓库（本仓库）
      - uses: actions/checkout@v4                     # App 仓库：schema 的真源
        with:
          repository: fanqie2025/mytingshu-ios
          path: .ios
      - name: 按 iOS schema 校验（阻塞）
        run: |
          python3 .ios/tools/audit_subscription.py subscription/sources.json \
            --swift .ios/Sources/RuleSource.swift

  live:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: 逐站校验（不阻塞，只看结果）
        run: |
          set +e
          for f in tools/live_tests/*_verify.py; do
            echo "=================================================="
            echo "▶ $f"
            timeout 180 python3 "$f" || echo "⚠️ $f 未通过（可能是境外网络问题，本机复跑确认）"
          done
          exit 0
